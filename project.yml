name: ArtifactCollector
options:
  bundleIdPrefix: com.artifactcollector
  deploymentTarget:
    iOS: 17.0
    macOS: 14.0
settings:
  SWIFT_VERSION: 5.9
targets:
  ArtifactCollector:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: ArtifactCollector
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.artifactcollector.app
      INFOPLIST_FILE: ArtifactCollector/Info.plist
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_ENTITLEMENTS: ArtifactCollector/ArtifactCollector.entitlements
      ENABLE_PREVIEWS: true
      SWIFT_STRICT_CONCURRENCY: complete
      GENERATE_INFOPLIST_FILE: false
    entitlements:
      path: ArtifactCollector/ArtifactCollector.entitlements
